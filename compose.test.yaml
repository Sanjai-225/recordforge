services:
  postgres-test:
    image: postgres:17
    command: ["postgres", "-c", "max_connections=150"]
    ports: ["127.0.0.1:54324:5432"]
    environment:
      POSTGRES_DB: recordforge_test
      POSTGRES_USER: recordforge_test
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Set a random disposable test password}
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recordforge_test -d recordforge_test"]
      interval: 2s
      retries: 15
